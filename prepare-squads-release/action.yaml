name: "Prepare Squads Release"
description: "Creates Solana release buffers and assigns their authority to a Squads vault without creating a Squads proposal"
inputs:
  program-id:
    description: "Program ID to upgrade"
    required: true
  program:
    description: "Program name"
    required: true
  rpc-url:
    description: "Solana RPC URL"
    required: true
  keypair:
    description: "Payer keypair used for buffer preparation. It does not need to be a Squads member."
    required: true
  squads-vault:
    description: "Squads vault address to set as buffer authority"
    required: true
  metadata-path:
    description: "Optional IDL or metadata JSON path for a program-metadata buffer"
    required: false
    default: ""
  metadata-seed:
    description: "Program-metadata seed when creating a metadata buffer (default: idl)"
    required: false
    default: "idl"
  prefund-metadata-account:
    description: "Pre-fund the metadata PDA from the payer so Squads proposals need no vault SystemProgram.transfer"
    required: false
    default: "true"
  priority-fee:
    description: "Priority fee in microlamports"
    required: false
    default: "100000"
  program-buffer-max-sign-attempts:
    description: "Maximum Solana CLI signing attempts for the program buffer"
    required: false
    default: "100"
  program-buffer-write-timeout-minutes:
    description: "Maximum minutes to let a single program buffer write run before printing diagnostics"
    required: false
    default: "55"
  program-buffer-retry-attempts:
    description: "Maximum program buffer write attempts"
    required: false
    default: "1"
  program-buffer-use-rpc:
    description: "Send program buffer write transactions through the configured RPC instead of validator TPUs"
    required: false
    default: "false"
  export-verify-pda:
    description: "Export a solana-verify PDA transaction for the Squads vault"
    required: false
    default: "false"
  repo-url:
    description: "GitHub repository URL for solana-verify PDA export"
    required: false
    default: ""
  commit-hash:
    description: "Git commit hash to verify against"
    required: false
    default: ""

outputs:
  buffer:
    description: "Created program buffer address"
    value: ${{ steps.write-program-buffer.outputs.buffer }}
  metadata-buffer:
    description: "Created program-metadata buffer address"
    value: ${{ steps.write-metadata-buffer.outputs.buffer }}
  pda-tx:
    description: "Base64-encoded verify PDA transaction"
    value: ${{ steps.export-verify-pda.outputs.pda_tx }}

runs:
  using: "composite"
  steps:
    - name: Validate inputs
      shell: bash
      run: |
        if [ "${{ inputs.export-verify-pda }}" = "true" ] && [ -z "${{ inputs.repo-url }}" ]; then
          echo "Error: repo-url is required when export-verify-pda is true"
          exit 1
        fi
        if [ "${{ inputs.export-verify-pda }}" = "true" ] && [ -z "${{ inputs.commit-hash }}" ]; then
          echo "Error: commit-hash is required when export-verify-pda is true"
          exit 1
        fi

    - name: Write program buffer
      id: write-program-buffer
      uses: solana-foundation/github-actions/write-program-buffer@d1e779ca332fc499507fadf97d9c780ffed5a71f
      with:
        program-id: ${{ inputs.program-id }}
        program: ${{ inputs.program }}
        rpc-url: ${{ inputs.rpc-url }}
        keypair: ${{ inputs.keypair }}
        buffer-authority-address: ${{ inputs.squads-vault }}
        priority-fee: ${{ inputs.priority-fee }}
        max-sign-attempts: ${{ inputs.program-buffer-max-sign-attempts }}
        write-timeout-minutes: ${{ inputs.program-buffer-write-timeout-minutes }}
        retry-attempts: ${{ inputs.program-buffer-retry-attempts }}
        use-rpc: ${{ inputs.program-buffer-use-rpc }}

    - name: Write metadata buffer
      id: write-metadata-buffer
      if: inputs.metadata-path != ''
      uses: solana-foundation/github-actions/write-metadata-buffer@d1e779ca332fc499507fadf97d9c780ffed5a71f
      with:
        idl-path: ${{ inputs.metadata-path }}
        rpc-url: ${{ inputs.rpc-url }}
        keypair: ${{ inputs.keypair }}
        buffer-authority: ${{ inputs.squads-vault }}
        priority-fees: ${{ inputs.priority-fee }}

    # Prefund in this action (not the nested pin) so it works before write-metadata-buffer
    # is re-pinned to a revision that includes prefund. Safe no-op if already funded.
    - name: Prefund metadata account rent
      if: inputs.metadata-path != '' && inputs.prefund-metadata-account == 'true' && steps.write-metadata-buffer.outputs.buffer != ''
      shell: bash
      run: |
        set -euo pipefail
        echo "$DEPLOY_KEYPAIR" > ./deploy-keypair.json && chmod 600 ./deploy-keypair.json
        BUFFER="${{ steps.write-metadata-buffer.outputs.buffer }}"
        RPC="${{ inputs.rpc-url }}"
        echo "Pre-funding metadata PDA rent from payer (avoids Squads vault SystemProgram.transfer)..."

        # Canonical program-metadata PDA = findPDA([program, seed padded to 16 bytes], ProgM6...)
        SEED_HEX=$(printf '%s' "${{ inputs.metadata-seed }}" | od -An -tx1 | tr -d ' \n' | awk '{ s=$0; while (length(s) < 32) s=s"0"; print s }')
        PDA=$(solana find-program-derived-address ProgM6JCCvbYkfKqJYHePx4xxSUSqJp7rh8Lyv7nk7S \
          "pubkey:${{ inputs.program-id }}" "hex:$SEED_HEX")
        if [ -z "$PDA" ]; then
          echo "Error: failed to derive metadata PDA"
          exit 1
        fi

        BUFFER_LEN=$(solana account "$BUFFER" -u "$RPC" --output json | jq -r '.account.space')
        if ! [[ "$BUFFER_LEN" =~ ^[0-9]+$ ]]; then
          echo "Error: could not read buffer account size for $BUFFER (got: $BUFFER_LEN)"
          exit 1
        fi

        REQUIRED=$(solana rent "$BUFFER_LEN" --lamports -u "$RPC" | grep -oE '[0-9]+' | head -1)
        if ! [[ "$REQUIRED" =~ ^[0-9]+$ ]]; then
          echo "Error: could not calculate rent for $BUFFER_LEN bytes (got: $REQUIRED)"
          exit 1
        fi

        CURRENT=$(solana balance "$PDA" -u "$RPC" --lamports 2>/dev/null | awk '{print $1}' || true)
        CURRENT=${CURRENT:-0}
        if ! [[ "$CURRENT" =~ ^[0-9]+$ ]]; then
          CURRENT=0
        fi
        SHORTFALL=$((REQUIRED - CURRENT))

        echo "Metadata PDA: $PDA"
        echo "Target size: $BUFFER_LEN bytes, required: $REQUIRED, current: $CURRENT, shortfall: $SHORTFALL"

        if [ "$SHORTFALL" -gt 0 ]; then
          AMOUNT_SOL=$(awk "BEGIN { printf \"%.9f\", $SHORTFALL / 1000000000 }")
          solana transfer "$PDA" "$AMOUNT_SOL" \
            --from ./deploy-keypair.json \
            --keypair ./deploy-keypair.json \
            --url "$RPC" \
            --allow-unfunded-recipient
          echo "Pre-funded $SHORTFALL lamports ($AMOUNT_SOL SOL) -> $PDA"
        else
          echo "Account already has enough lamports; skipping transfer"
        fi

        rm -f ./deploy-keypair.json
      env:
        DEPLOY_KEYPAIR: ${{ inputs.keypair }}

    - name: Export verify PDA transaction
      id: export-verify-pda
      if: inputs.export-verify-pda == 'true'
      uses: solana-foundation/github-actions/verify-build@d1e779ca332fc499507fadf97d9c780ffed5a71f
      with:
        program-id: ${{ inputs.program-id }}
        program: ${{ inputs.program }}
        rpc-url: ${{ inputs.rpc-url }}
        keypair: ${{ inputs.keypair }}
        repo-url: ${{ inputs.repo-url }}
        commit-hash: ${{ inputs.commit-hash }}
        network: "mainnet"
        use-squads: "true"
        vault-address: ${{ inputs.squads-vault }}

    - name: Write summary
      shell: bash
      run: |
        echo "## Squads release buffers" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- Program: \`${{ inputs.program-id }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- Program buffer: \`${{ steps.write-program-buffer.outputs.buffer }}\`" >> $GITHUB_STEP_SUMMARY
        if [ -n "${{ steps.write-metadata-buffer.outputs.buffer }}" ]; then
          echo "- Metadata buffer: \`${{ steps.write-metadata-buffer.outputs.buffer }}\`" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.prefund-metadata-account }}" = "true" ]; then
            echo "- Metadata PDA rent: pre-funded from payer (Squads proposal should not need a vault SystemProgram.transfer)" >> $GITHUB_STEP_SUMMARY
          fi
        fi
        if [ "${{ inputs.export-verify-pda }}" = "true" ]; then
          echo "- Verify PDA transaction exported: \`true\`" >> $GITHUB_STEP_SUMMARY
        fi
        echo "- Buffer authority: \`${{ inputs.squads-vault }}\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Create the program upgrade from Squads using the buffer above. This action does not create a Squads proposal." >> $GITHUB_STEP_SUMMARY
        echo "Program size is extended during buffer prep; metadata/IDL rent is pre-funded from the payer when enabled." >> $GITHUB_STEP_SUMMARY
